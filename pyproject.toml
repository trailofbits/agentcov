[project]
name = "agentcov"
version = "0.1.0"
description = "AI-agent read coverage for source files, with LCOV and gcov-compatible reports."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Trail of Bits" }]
dependencies = []

[project.urls]
Homepage = "https://github.com/trailofbits/agentcov"
Repository = "https://github.com/trailofbits/agentcov"
Issues = "https://github.com/trailofbits/agentcov/issues"
Changelog = "https://github.com/trailofbits/agentcov/blob/main/CHANGELOG.md"

[project.scripts]
agentcov = "agentcov.cli:main"

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
]
lint = [
    "ruff>=0.16.1",
    "ty>=0.0.65",
]
test = [
    "pytest>=9.1.1",
    "pytest-cov>=7.0.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["agent-coverage"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["src/agentcov"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
